[build-system]
requires = ["setuptools >= 77"]
build-backend = "setuptools.build_meta"

[project]
name = "ambiguous"
authors = [{name = "Daniel Pepper"}]
dynamic = ["version"]
description = "flexibility when you need it"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE.txt"]
keywords = ["decorator", "optional parentheses", "multiget"]
classifiers = [
  # https://pypi.org/classifiers/
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Programming Language :: Python :: 3.15",
  "Topic :: Software Development :: Libraries :: Python Modules",
  "Topic :: Utilities",
]
requires-python = ">= 3.12"

[project.urls]
Homepage = "https://github.com/dpep/py_ambiguous"
Issues = "https://github.com/dpep/py_ambiguous/issues"
Changelog = "https://github.com/dpep/py_ambiguous/blob/main/CHANGES.txt"

[tool.setuptools]
packages = ["ambiguous"]

[tool.setuptools.dynamic]
version = {attr = "ambiguous.__version__"}

[dependency-groups]
dev = ["ruff"]

[tool.ruff]
target-version = "py312"

[tool.ruff.lint]
extend-select = ["I", "UP", "B"]
